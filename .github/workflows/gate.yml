name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The gate is the same one the project runs locally: the full suite and a real
# build. It runs without provider keys, so every test uses stubs and no real
# provider is ever called from CI.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          # prisma.config.ts reads DIRECT_URL when it loads, before dispatching
          # any command, and throws if it is unset. The client generator does not
          # connect, so a placeholder is enough.
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Full suite
        run: npm run test:run

      - name: Build
        run: npm run build
        env:
          # The build must not need a real key: the app reads it at runtime.
          NUXT_FAL_KEY: ci-placeholder
